<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6f2b82">
<link rel="icon" type="image/png" href="images/Benevolent_transparent_icon.png">
<title>Pre-Payroll Check</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--purple:#742d86;--deep:#3e1649;--soft:#f5eef8;--ink:#241b29;--muted:#746a78;--line:#e9e1eb}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
background:radial-gradient(circle at 10% -10%,rgba(123,52,143,.13),transparent 28rem),#faf8fb;min-height:100vh}
.shell{width:min(1100px,calc(100% - 28px));margin:0 auto}
header{padding:22px 0 8px;display:flex;align-items:center;justify-content:space-between}
header img{width:210px;max-width:55vw;height:auto}
h1{margin:18px 0 4px;font-size:clamp(28px,4.5vw,40px);letter-spacing:-.03em;color:var(--deep)}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 32px rgba(53,27,59,.06);padding:22px;margin-bottom:18px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:2px dashed #d9cddd;border-radius:18px;padding:30px 16px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--purple);background:var(--soft)}
.drop b{color:var(--deep);font-size:17px}.drop span{color:var(--muted);font-size:13px}
.btn{appearance:none;border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;background:var(--purple);color:#fff}
.btn:hover{background:#572064}.btn.ghost{background:var(--soft);color:var(--purple)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.subject{font-size:16px;font-weight:600}
#emailBox{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;overflow-x:auto;background:#fff}
.status{font-size:14px;color:var(--muted)}.err{color:#b00020;font-weight:600}
.ok{color:#1b7f3b;font-weight:700}
.x{border:0;background:none;color:#b9a9bf;cursor:pointer;font-size:16px;line-height:1;padding:2px 6px}
.x:hover{color:#b00020}
.act{width:100%;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
.tools th.t,.tools td.t{background:#faf6fb;border:1px solid #e9e1eb !important}
.hidden{display:none}
footer{color:#a094a4;font-size:11px;text-align:center;padding:26px 0 40px}
.copied{background:#1b7f3b !important;color:#fff !important}
</style></head><body>
<div class="shell">
<header><img src="images/Benevolent_transparent_logo.png" alt="" onerror="this.style.display='none'"></header>
<h1>Pre-Payroll Check</h1>
<p class="sub">Upload the HHAx Pre-process Payroll Detail file. Files stay on your computer.</p>

<div class="card">
  <label class="drop" id="drop"><b>Choose file or drop it here</b><span>.xlsx</span>
  <input id="file" type="file" accept=".xlsx,.xls" class="hidden"></label>
  <div id="status" class="status" style="margin-top:12px"></div>
</div>

<div id="results" class="hidden">
  <div class="card">
    <div class="row"><div><div class="label">Subject</div><div class="subject" id="subject">Pre-payroll file review results (FYI)</div></div>
    <button class="btn ghost" id="copySubject">Copy subject</button></div>
  </div>
  <div class="card">
    <div class="row"><div class="label" style="margin:0">Email</div><button class="btn" id="copyBody">Copy for email</button></div>
    <div id="emailBox"></div>
  </div>
</div>
<footer>A Davidowitz Project © <span id="yr">2026</span> · Pre-Payroll Check v1</footer>
</div>
<script>

// ============================================================
// APPROVED OVERRIDE RATES  (edit names / rates here only)
// Same list as the Python script's approved_rates.
// ============================================================
const APPROVED_RATES = {
  "Diarra Epse Ouattara Aminata": 20.50,
  "Zaynieva Shakhnoz": 21.50,
  "Rahimova Iroda": 21.50,
  "Shukurova Gulnoza": 21.50,
  "Salieva Nilufar": 21.50,
  "Kamoliddinova Shahzodahon": 21.50,
  "Grullon Urena Yelissbet": 21.00,
  // Add more caregivers and their approved rates as needed
};
const IN_SERVICE_PAY_CODES = ["HHA In-Service", "PCA In-Service"];
const SHEET_NAME = "Pre-Process Payroll Hours by Ca";
// ============================================================

function pyStr(v){ // mimic pandas/python str() of a cell
  if (v === null || v === undefined) return "nan";
  if (typeof v === "number") { if (Number.isNaN(v)) return "nan"; return String(v); }
  if (v instanceof Date) { const p=n=>String(n).padStart(2,"0"); return `${v.getFullYear()}-${p(v.getMonth()+1)}-${p(v.getDate())} ${p(v.getHours())}:${p(v.getMinutes())}:${p(v.getSeconds())}`; }
  return String(v);
}
function notNull(v){ return !(v === null || v === undefined || (typeof v === "number" && Number.isNaN(v))); }
function pyFloat(s){ // strict like python float(); throws on bad input
  const t = String(s).trim();
  if (/^[+-]?nan$/i.test(t)) return NaN;
  if (/^[+-]?(inf|infinity)$/i.test(t)) return t.startsWith("-") ? -Infinity : Infinity;
  if (!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(t.replace(/_/g,""))) throw new Error("bad float");
  return Number(t.replace(/_/g,""));
}
function pyRepr(x){ if (Number.isInteger(x)) return x.toFixed(1); return String(x); }
function parseHHMM(value){
  if (typeof value === "string" && value.includes(":")) {
    const parts = value.split(":");
    if (parts.every(p => /^\d+$/.test(p))) {
      if (parts.length !== 2) throw new Error("unpack");
      return parseInt(parts[0],10) + parseInt(parts[1],10)/60.0;
    }
  }
  return null;
}
function f2(x){ return x.toFixed(2); }

function runChecks(rows){
  // rows: array of arrays, index = pandas row index, col index = pandas column
  const cell = (r,c) => (rows[r] && rows[r][c] !== undefined) ? rows[r][c] : null;
  const rowHas = (r, s) => { const row = rows[r] || []; const n = Math.max(row.length, 1);
    for (let c=0;c<n;c++){ if (pyStr(row[c]===undefined?null:row[c]).includes(s)) return true; } return false; };
  const N = rows.length;
  const caregiverRows = [], totalRows = [];
  for (let r=0;r<N;r++){ if (rowHas(r,"Caregiver Code:")) caregiverRows.push(r); if (rowHas(r,"Total")) totalRows.push(r); }
  let lastTotal=-1, grandTotal=-1;
  if (totalRows.length > 1){ lastTotal = totalRows[totalRows.length-2]; grandTotal = totalRows[totalRows.length-1]; }
  const exclude = new Set([lastTotal, grandTotal]);
  const inSvc = new Set(IN_SERVICE_PAY_CODES.map(c=>c.toLowerCase()));
  const liveIn = ["T1020","T1020:TV"];
  const problems = [];
  const patientDay = new Map();
  const push = (code,name,row,problem,detail) => problems.push({code,name,row,problem,detail:String(detail)});

  for (let idx=0; idx<caregiverRows.length; idx++){
    const start = caregiverRows[idx];
    const end = idx < caregiverRows.length-1 ? caregiverRows[idx+1] : N;
    const sec = []; for (let r=start;r<end;r++) sec.push(r);
    const tl = sec.filter(r => rowHas(r,"Total:")).sort((a,b)=>a-b);
    let totalIn = new Set(), extra = new Set();
    if (tl.length){ totalIn = new Set([tl[0]]); extra = new Set(tl.slice(1)); }
    const hc = cell(start,1);
    const header = (typeof hc === "string") ? hc : "";
    let code="", name="";
    if (header.includes("Caregiver Code:")) code = header.split("Caregiver Code:").pop().split("Caregiver Name:")[0].trim();
    if (header.includes("Caregiver Name:")) name = header.split("Caregiver Name:").pop().trim();
    let hasLiveIn = false, inSvcHours = 0;
    for (const ri of sec){
      if (exclude.has(ri) || totalIn.has(ri) || extra.has(ri)) continue;
      const svc = pyStr(cell(ri,8)).trim();
      if (liveIn.includes(svc)) hasLiveIn = true;
      try {
        const pc = pyStr(cell(ri,15)).trim();
        const pid = notNull(cell(ri,2)) ? pyStr(cell(ri,2)).trim() : "";
        const vh = parseHHMM(pyStr(cell(ri,11)));
        const ph = parseHHMM(pyStr(cell(ri,14)));
        const oh = parseHHMM(pyStr(cell(ri,22)));
        const looks = svc === "0" && !pid && vh !== null && vh === 0;
        if (inSvc.has(pc.toLowerCase()) || looks) inSvcHours += (ph||0) + (oh||0);
      } catch(e) {}
    }
    for (const r of sec){
      if (exclude.has(r) || extra.has(r)) continue;
      let vds = "";
      try { const v = cell(r,3);
        if (v instanceof Date){ const p=n=>String(n).padStart(2,"0"); vds = `${v.getFullYear()}-${p(v.getMonth()+1)}-${p(v.getDate())}`; }
        else if (typeof v === "string" && v.trim()) vds = v.trim();
      } catch(e){ vds = ""; }
      const sc = pyStr(cell(r,8)).trim();
      const pc = pyStr(cell(r,15)).trim();
      const phs = pyStr(cell(r,14));
      const ph = parseHHMM(phs);
      const ohs = pyStr(cell(r,22));
      const ohd = parseHHMM(ohs);
      let tph = (ph||0) + (ohd||0);
      let rate;
      try { rate = pyFloat(pyStr(cell(r,17)).replace(/\$/g,"").replace(/,/g,"").trim()); } catch(e){ rate = 0; }
      if (rate <= 0) tph = 0;
      if (totalIn.has(r)){
        const ots = pyStr(cell(r,22));
        const ot = parseHHMM(ots);
        if (ot !== null){
          const net = Math.max(ot - inSvcHours, 0);
          if (Object.prototype.hasOwnProperty.call(APPROVED_RATES,name) && ot > 0)
            push(code,name,r,"Overtime for caregiver with approved override rate",`Approved Rate: $${f2(APPROVED_RATES[name])} | Total OT: ${ots}`);
          const det = inSvcHours === 0 ? `Total OT: ${ots}` : `Total OT: ${ots} (In-Service: ${f2(inSvcHours)} hrs, Net OT: ${f2(net)} hrs)`;
          if (hasLiveIn){ if (net > 12) push(code,name,r,"Net OT hours for Live-In exceed 12:00",det); }
          else { if (net > 8) push(code,name,r,"Net OT hours for Non-Live-In exceed 08:00",det); }
        }
      } else {
        let pn="", pid="";
        try { pn = notNull(cell(r,1)) ? pyStr(cell(r,1)).trim() : ""; pid = notNull(cell(r,2)) ? pyStr(cell(r,2)).trim() : ""; } catch(e){}
        const pidN = (pid.endsWith(".0") ? pid.slice(0,-2) : pid).trim();
        if (pidN === "900515" || pidN === "WSF-900515" || pn.toLowerCase() === "training evv")
          push(code,name,r,`TRAINING EVV PATIENT FOUND - DO NOT PAY - ${vds}`,`Patient: ${pn} | Admission ID: ${pidN}`);
        let vhs = "", vh = null;
        try { vhs = pyStr(cell(r,11)); vh = parseHHMM(vhs); } catch(e){ vhs=""; vh=null; }
        let isIn = inSvc.has(pc.toLowerCase());
        const looks = sc === "0" && !pid && vh !== null && vh === 0;
        const nonPay = pc.toLowerCase().includes("non payable");
        if (nonPay && looks) isIn = true;
        if (nonPay) push(code,name,r,`${isIn?"In-Service":"Visit"} marked as Non Payable - ${vds}`, pyStr(cell(r,15)));
        if (!isIn && pn && pid && vds && tph > 0){
          const k = pid + "\u0001" + vds;
          if (!patientDay.has(k)) patientDay.set(k,{pid, dos:vds, pname:pn, entries:[]});
          patientDay.get(k).entries.push({code,name,row:r,pay:phs,ot:ohs,tph});
        }
        try {
          if (looks && !isIn && !nonPay)
            push(code,name,r,`In-service paid with a non-in-service pay code - ${vds}`,`Pay Code Used: ${(pc && pc.toLowerCase() !== "nan") ? pc : "(blank)"}`);
          if (liveIn.includes(sc) && vh !== null && vh < 13)
            push(code,name,r,`Live-In visit is less than 13:00 - ${vds}`, vhs);
          if (!isIn && !looks && tph > 0 && vh !== null){
            let vb = Math.trunc(vh); if (vh > vb) vb += 1;
            if (tph > vb) push(code,name,r,`Pay hours exceed visit hours - ${vds}`,`Pay: ${phs}, OT: ${ohs}, Visit: ${vhs}`);
          }
        } catch(e){}
      }
    }
    // PAY RATE CHECK
    for (const r of sec){
      const v17 = cell(r,17);
      const isStrOrFloat = (typeof v17 === "string") || (typeof v17 === "number" && !Number.isInteger(v17)) || !notNull(v17);
      if (isStrOrFloat && !exclude.has(r) && !extra.has(r)){
        let reg;
        try { const s = pyStr(v17); reg = s.includes("$") ? pyFloat(s.replace(/\$/g,"").replace(/,/g,"")) : pyFloat(s); } catch(e){ continue; }
        const hv = cell(r,29); let hol = null;
        try { if (notNull(hv)){ const hs = pyStr(hv).trim(); if (hs && hs.toLowerCase() !== "nan") hol = pyFloat(hs.replace(/\$/g,"").replace(/,/g,"")); } } catch(e){ hol = null; }
        const isHol = hol !== null;
        const chk = isHol ? hol : reg;
        const prc = pyStr(cell(r,15));
        const base = prc === "PND LPN Hourly" ? 35.00 : (Object.prototype.hasOwnProperty.call(APPROVED_RATES,name) ? APPROVED_RATES[name] : 20.00);
        const lim = base * (isHol ? 1.5 : 1.0);
        if (chk > lim) push(code,name,r, isHol ? `Holiday rate exceeds $${f2(lim)} (1.5x approved rate)` : `Pay rate exceeds $${f2(lim)}`, `$${pyRepr(chk)}`);
      }
    }
  }
  for (const info of patientDay.values()){
    const tot = info.entries.reduce((a,e)=>a+(e.tph||0),0);
    if (tot > 24) for (const e of info.entries)
      push(e.code,e.name,e.row,`Patient day exceeds 24:00 - ${info.pname} (${info.pid}) - ${info.dos}`,`Day Total: ${f2(tot)} hrs | This Row Pay: ${e.pay}, OT: ${e.ot}`);
  }
  return problems;
}


const SENT_A = "These were flagged by our scripts for awareness only. All items are still being included in payroll as is, and no payroll changes were made based on this review.";
const SENT_B = "These were flagged by our scripts for awareness only. Items are included in payroll as is unless an action is noted below.";
let ITEMS = [];

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const TD = 'style="border:1px solid #000;padding:4px 8px;vertical-align:top;"';
const TH = 'style="border:1px solid #000;padding:4px 8px;font-weight:bold;text-align:left;background:#f2f2f2;"';

function emailHTML(forCopy){
  const live = ITEMS.filter(i=>!i.removed);
  const anyAct = live.some(i=>i.action.trim());
  let h = '<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#000;">';
  h += '<p>Good morning,</p>';
  if (!live.length){
    h += '<p>Below are the results from our internal pre-payroll checks.</p><p>No issues were found by our scripts this week.</p></div>';
    return h;
  }
  h += '<p>Below are the results from our internal pre-payroll checks.</p>';
  h += '<p>' + (anyAct ? SENT_B : SENT_A) + '</p>';
  h += '<table style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:13px;" class="tools"><tr>';
  ['Caregiver Code','Caregiver Name','Problem','Detail'].forEach(c=> h += `<th ${TH}>${c}</th>`);
  if (anyAct) h += `<th ${TH}>Action Taken</th>`;
  if (!forCopy) h += '<th class="t" style="padding:4px 8px;font-size:11px;color:#746a78;text-align:left">Action (optional)</th><th class="t"></th>';
  h += '</tr>';
  ITEMS.forEach((it,i)=>{
    if (it.removed) return;
    h += `<tr><td ${TD}>${esc(it.code)}</td><td ${TD}>${esc(it.name)}</td><td ${TD}>${esc(it.problem)}</td><td ${TD}>${esc(it.detail)}</td>`;
    if (anyAct) h += `<td ${TD}>${esc(it.action)}</td>`;
    if (!forCopy) h += `<td class="t" style="padding:4px"><input class="act" data-i="${i}" value="${esc(it.action)}" placeholder="Action taken"></td><td class="t"><button class="x" title="Remove from email" data-x="${i}">✕</button></td>`;
    h += '</tr>';
  });
  h += '</table></div>';
  return h;
}
function plain(){
  const live = ITEMS.filter(i=>!i.removed);
  const anyAct = live.some(i=>i.action.trim());
  if (!live.length) return "Good morning,\n\nBelow are the results from our internal pre-payroll checks.\n\nNo issues were found by our scripts this week.";
  let t = "Good morning,\n\nBelow are the results from our internal pre-payroll checks.\n\n" + (anyAct?SENT_B:SENT_A) + "\n\n";
  t += ["Caregiver Code","Caregiver Name","Problem","Detail"].concat(anyAct?["Action Taken"]:[]).join("\t") + "\n";
  live.forEach(it=> t += [it.code,it.name,it.problem,it.detail].concat(anyAct?[it.action]:[]).join("\t") + "\n");
  return t;
}
function render(){
  const box = document.getElementById("emailBox");
  box.innerHTML = emailHTML(false);
  box.querySelectorAll("input.act").forEach(inp=> inp.addEventListener("change", e=>{ ITEMS[+e.target.dataset.i].action = e.target.value; const f=document.activeElement; render(); }));
  box.querySelectorAll("button.x").forEach(b=> b.addEventListener("click", e=>{ ITEMS[+e.currentTarget.dataset.x].removed = true; render(); }));
  const n = ITEMS.filter(i=>!i.removed).length, rem = ITEMS.length - n;
  setStatus(n ? `<span class="ok">${n} item${n===1?"":"s"} flagged</span>` + (rem?` · ${rem} removed · <a href="#" id="undo">undo</a>`:"") : '<span class="ok">No issues found</span>' + (rem?` · ${rem} removed · <a href="#" id="undo">undo</a>`:""));
  const u = document.getElementById("undo"); if (u) u.onclick = e=>{e.preventDefault(); ITEMS.forEach(i=>i.removed=false); render();};
}
function setStatus(h){ document.getElementById("status").innerHTML = h; }

async function copyRich(html, text, btn){
  let ok = false;
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({"text/html": new Blob([html],{type:"text/html"}), "text/plain": new Blob([text],{type:"text/plain"})})]);
      ok = true;
    }
  } catch(e){}
  if (!ok){
    const d = document.createElement("div"); d.contentEditable = "true"; d.innerHTML = html;
    d.style.position="fixed"; d.style.left="-9999px"; document.body.appendChild(d);
    const r = document.createRange(); r.selectNodeContents(d); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    try { ok = document.execCommand("copy"); } catch(e){}
    s.removeAllRanges(); d.remove();
  }
  const old = btn.textContent; btn.textContent = ok ? "Copied ✓" : "Copy failed"; btn.classList.add("copied");
  setTimeout(()=>{ btn.textContent = old; btn.classList.remove("copied"); }, 1600);
}
document.getElementById("copyBody").onclick = e => copyRich(emailHTML(true), plain(), e.currentTarget);
document.getElementById("copySubject").onclick = e => { const s = document.getElementById("subject").textContent; copyRich(esc(s), s, e.currentTarget); };

function loadFile(f){
  setStatus("Checking…");
  const rd = new FileReader();
  rd.onload = ev => {
    try {
      const wb = XLSX.read(new Uint8Array(ev.target.result), {type:"array", cellDates:true});
      const ws = wb.Sheets[SHEET_NAME];
      if (!ws){ setStatus(`<span class="err">Sheet "${SHEET_NAME}" not found. Is this the Pre-process Payroll Detail export?</span>`); return; }
      const ref = XLSX.utils.decode_range(ws["!ref"]);
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null, blankrows:true, range:{s:{r:0,c:0}, e:ref.e}});
      ITEMS = runChecks(rows).map(p => ({...p, action:"", removed:false}));
      document.getElementById("results").classList.remove("hidden");
      render();
    } catch(err){ setStatus(`<span class="err">Could not read the file: ${esc(err.message)}</span>`); }
  };
  rd.readAsArrayBuffer(f);
}
const fi = document.getElementById("file"), dr = document.getElementById("drop");
fi.addEventListener("change", e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
["dragover","dragenter"].forEach(t=> dr.addEventListener(t, e=>{e.preventDefault(); dr.classList.add("over");}));
["dragleave","drop"].forEach(t=> dr.addEventListener(t, e=>{e.preventDefault(); dr.classList.remove("over");}));
dr.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
document.getElementById("yr").textContent = new Date().getFullYear();
</script></body></html>
